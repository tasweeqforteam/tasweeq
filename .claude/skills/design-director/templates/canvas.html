<!doctype html>
<!--
  design-director starter canvas. Copy this file next to your copy.json, then:
    1. paste the grid.py CSS block into the <style> :root below
    2. set dd:canvas / dd:safe / dd:copy meta to the brief
    3. place content on the .live grid with grid-column / grid-row
    4. node scripts/render.mjs this.html --out out/name --grid
    5. node scripts/qa.mjs this.html --json out/qa.json
  Adjust the stylesheet href to point at templates/base.css from wherever this file lives.
  Default type: Alexandria (Arabic) + Inter Tight (English), set by base.css. Measure Arabic display widths before sizing.
-->
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="dd:canvas" content="1080x1350">
  <meta name="dd:safe" content="72,72,72,72">
  <meta name="dd:copy" content="copy.json">
  <link rel="stylesheet" href="base.css">
  <style>
    :root {
      /* grid.py --format ig-portrait --columns 6 */
      --canvas-w: 1080px; --canvas-h: 1350px;
      --margin-top: 72px; --margin-bottom: 72px;
      --margin-inline-start: 72px; --margin-inline-end: 72px;
      --columns: 6; --gutter: 24px;
      --rows: 8; --row-gap: 24px; --baseline: 8px;
    }
    .zone { background: repeating-linear-gradient(45deg, #ddd 0 12px, #e8e8e8 12px 24px); }
    .headline { grid-column: 1 / -1; grid-row: 1 / 3; font-size: 110px; align-self: end; }
    .visual   { grid-column: 3 / -1; grid-row: 3 / 8; }
    .body     { grid-column: 1 / 3;  grid-row: 4 / 7; font-size: 32px; align-self: start; }
    .cta      { grid-column: 1 / 3;  grid-row: 8; align-self: end; font-size: 34px; }
  </style>
</head>
<body>
  <section class="canvas">
    <div class="live">
      <h1 class="headline display-ar" lang="ar" data-copy="headline">العنوان الرئيسي</h1>
      <div class="visual zone" aria-label="image slot: see image brief"></div>
      <p class="body" lang="ar" data-copy="body">نص داعم قصير يشرح الفكرة.</p>
      <p class="cta" lang="ar" data-copy="cta">اطلب الآن</p>
    </div>
  </section>
</body>
</html>
