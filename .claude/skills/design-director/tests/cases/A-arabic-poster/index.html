<!doctype html>
<!--
  TEST A · Arabic advertising poster · 1080×1350 (4:5 feed)
  Concept: "the suspended drop". Slowness made visible as a single drop frozen
  between dripper and carafe. The headline states it, the image proves it.
  Grid: asymmetric 6-col RTL (col 1 = right edge), 8 rows, margins 72, gutter 24, baseline 8.
  Type: Alexandria (user default) — headline 128 px / 800, sized from measurement (689 px per 100 px) to fit the 936 px live width.
  Zones: brand row 1 cols 1–3 · headline rows 2–4 cols 1–6, top-anchored · product cols 4–6 rows 4–8 (bleeds the bottom margin on purpose)
         sub cols 1–3 rows 5–6 · CTA cols 1–3 row 8.
  Lead principles: negative space · scale contrast · RTL directional movement.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="dd:canvas" content="1080x1350">
<meta name="dd:safe" content="72,72,72,72">
<meta name="dd:copy" content="copy.json">
<link rel="stylesheet" href="../../../templates/base.css">
<style>
  :root {
    --canvas-w: 1080px; --canvas-h: 1350px;
    --margin-top: 72px; --margin-bottom: 72px;
    --margin-inline-start: 72px; --margin-inline-end: 72px;
    --columns: 6; --gutter: 24px; --rows: 8; --row-gap: 24px; --baseline: 8px;
    --paper: #efe6d8; --ink: #1e1611; --accent: #8f3a1b; --muted: #5c4c40;
  }
  .brand { grid-column: 1 / 4; grid-row: 1; font-size: 40px; font-weight: 700; line-height: 1.2; align-self: start; }
  .tag { grid-column: 4 / 7; grid-row: 1; align-self: start; justify-self: end; font-family: var(--ff-la-text); font-size: 24px; color: var(--muted); padding-top: 14px; }
  .headline { grid-column: 1 / -1; grid-row: 2 / 5; align-self: start; font-size: 128px; line-height: 1.35; }
  .headline span { display: block; }
  .headline .l2 { color: var(--accent); }
  .sub { grid-column: 1 / 4; grid-row: 5 / 7; align-self: start; font-size: 34px; line-height: 1.6; }
  .cta { grid-column: 1 / 4; grid-row: 8; align-self: end; }
  .cta p { font-size: 34px; line-height: 1.5; padding-bottom: 8px; border-bottom: 3px solid var(--accent); display: inline-block; }
  .product { position: absolute; inset-inline-end: 56px; bottom: 0; width: 420px; height: 785px; }
</style>
</head>
<body>
<section class="canvas">
  <svg class="product" viewBox="0 0 460 860" role="img" aria-label="Vector illustration: ceramic pour-over dripper above a glass carafe, one drop falling">
    <defs>
      <linearGradient id="cer" x1="0" x2="1"><stop offset="0" stop-color="#4a3b31"/><stop offset=".35" stop-color="#2c221c"/><stop offset="1" stop-color="#16100c"/></linearGradient>
      <linearGradient id="glass" x1="0" x2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset=".25" stop-color="#ffffff" stop-opacity=".12"/><stop offset=".8" stop-color="#ffffff" stop-opacity=".05"/><stop offset="1" stop-color="#ffffff" stop-opacity=".4"/></linearGradient>
      <linearGradient id="brew" x1="0" x2="1"><stop offset="0" stop-color="#4a2a18"/><stop offset=".5" stop-color="#2b170d"/><stop offset="1" stop-color="#1a0d07"/></linearGradient>
      <radialGradient id="shadow"><stop offset="0" stop-color="#1e1611" stop-opacity=".28"/><stop offset="1" stop-color="#1e1611" stop-opacity="0"/></radialGradient>
    </defs>
    <!-- dripper -->
    <path d="M60 70 H400 L300 290 H160 Z" fill="url(#cer)"/>
    <path d="M60 70 H400" stroke="#5e4c40" stroke-width="3"/>
    <path d="M110 112 L176 268" stroke="#ffffff" stroke-opacity=".14" stroke-width="10" stroke-linecap="round"/>
    <rect x="120" y="290" width="220" height="22" rx="6" fill="#2c221c"/>
    <rect x="200" y="312" width="60" height="18" rx="4" fill="#16100c"/>
    <!-- the suspended drop -->
    <path d="M230 384 C230 384 210 418 210 434 A20 20 0 0 0 250 434 C250 418 230 384 230 384 Z" fill="#8f3a1b"/>
    <!-- carafe -->
    <ellipse cx="230" cy="842" rx="210" ry="18" fill="url(#shadow)"/>
    <path d="M150 500 Q150 480 170 480 H290 Q310 480 310 500 V540 Q420 600 420 720 Q420 836 230 836 Q40 836 40 720 Q40 600 150 540 Z" fill="#e9e2d7" opacity=".55"/>
    <path d="M52 700 Q60 610 160 556 H300 Q400 610 408 700 Q412 828 230 828 Q48 828 52 700 Z" fill="url(#brew)"/>
    <path d="M150 500 Q150 480 170 480 H290 Q310 480 310 500 V540 Q420 600 420 720 Q420 836 230 836 Q40 836 40 720 Q40 600 150 540 Z" fill="url(#glass)" stroke="#1e1611" stroke-opacity=".18" stroke-width="2"/>
    <path d="M86 650 Q92 610 140 584" stroke="#ffffff" stroke-opacity=".5" stroke-width="6" stroke-linecap="round" fill="none"/>
  </svg>
  <div class="live">
    <p class="brand display-ar" data-copy="brand">بُنّ الوادي</p>
    <p class="tag"><span dir="ltr" class="isolate" data-copy="url">wadi.example</span></p>
    <h1 class="headline display-ar"><span data-copy="headline_1">القهوة الجيدة</span><span class="l2" data-copy="headline_2">لا تستعجل</span></h1>
    <p class="sub" data-copy="sub">محمّصة يدويًا <br>بدفعات صغيرة كل صباح</p>
    <div class="cta"><p data-copy="cta">اطلب كيسك الأول بخصم ٢٠٪</p></div>
  </div>
</section>
</body>
</html>
