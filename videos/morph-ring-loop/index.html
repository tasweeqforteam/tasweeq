<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #b8e6c8;
      }
      #root {
        width: 100%;
        height: 100%;
        background: #b8e6c8;
      }
      #stage {
        width: 100%;
        height: 100%;
        display: block;
      }
      #stage path {
        fill: #1b4332;
      }
      #guide {
        fill: none;
        stroke: #1b4332;
        stroke-width: 2;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1080"
      data-height="1920"
    >
      <svg
        id="stage"
        class="clip"
        data-start="0"
        data-duration="5"
        data-track-index="0"
        viewBox="0 0 1080 1920"
        xmlns="http://www.w3.org/2000/svg"
      >
        <circle id="guide" cx="540" cy="960" r="320" opacity="0" />
        <g id="shapes"></g>
      </svg>
    </div>
    <script>
      // ---- Loop constants -------------------------------------------------
      const LOOP = 5; // seconds
      const CX = 540;
      const CY = 960;
      const COUNT = 8;
      const SAMPLES = 180; // polar samples per outline; every shape shares them
      const RING_TURN = 180; // degrees per loop: 360° per ~10s, linear
      const ease = gsap.parseEase("power2.inOut");

      // ---- Geometry helpers ------------------------------------------------
      // Local frame: +y points toward the ring center, +x runs along the ring.

      // Filleted polygon (works on convex and concave corners).
      function roundedPoly(verts, radius, seg = 24) {
        const out = [];
        const n = verts.length;
        for (let i = 0; i < n; i++) {
          const P = verts[(i - 1 + n) % n];
          const V = verts[i];
          const N = verts[(i + 1) % n];
          const r = Array.isArray(radius) ? radius[i] : radius;
          if (r <= 0) {
            out.push(V);
            continue;
          }
          let u1 = [P[0] - V[0], P[1] - V[1]];
          let u2 = [N[0] - V[0], N[1] - V[1]];
          const l1 = Math.hypot(u1[0], u1[1]);
          const l2 = Math.hypot(u2[0], u2[1]);
          u1 = [u1[0] / l1, u1[1] / l1];
          u2 = [u2[0] / l2, u2[1] / l2];
          const half = Math.acos(Math.max(-1, Math.min(1, u1[0] * u2[0] + u1[1] * u2[1]))) / 2;
          const d = Math.min(r / Math.tan(half), l1 * 0.49, l2 * 0.49);
          const rr = d * Math.tan(half);
          const bis = [u1[0] + u2[0], u1[1] + u2[1]];
          const bl = Math.hypot(bis[0], bis[1]);
          const C = [V[0] + (bis[0] / bl) * (rr / Math.sin(half)), V[1] + (bis[1] / bl) * (rr / Math.sin(half))];
          const A = [V[0] + u1[0] * d, V[1] + u1[1] * d];
          const B = [V[0] + u2[0] * d, V[1] + u2[1] * d];
          const a1 = Math.atan2(A[1] - C[1], A[0] - C[0]);
          let da = Math.atan2(B[1] - C[1], B[0] - C[0]) - a1;
          while (da > Math.PI) da -= 2 * Math.PI;
          while (da < -Math.PI) da += 2 * Math.PI;
          for (let k = 0; k <= seg; k++) {
            const a = a1 + (da * k) / seg;
            out.push([C[0] + rr * Math.cos(a), C[1] + rr * Math.sin(a)]);
          }
        }
        return out;
      }

      function arc(cx, cy, r, a0, a1, seg = 64) {
        const pts = [];
        for (let k = 0; k <= seg; k++) {
          const a = a0 + ((a1 - a0) * k) / seg;
          pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
        }
        return pts;
      }

      // Cast SAMPLES rays from the origin; r(θ) = farthest hit on the outline.
      // Shapes sampled on the same angles morph point-for-point.
      function toPolar(pts) {
        const radii = new Float64Array(SAMPLES);
        for (let s = 0; s < SAMPLES; s++) {
          const th = (s / SAMPLES) * Math.PI * 2;
          const dx = Math.cos(th);
          const dy = Math.sin(th);
          let best = 0;
          for (let i = 0; i < pts.length; i++) {
            const p = pts[i];
            const q = pts[(i + 1) % pts.length];
            const ex = q[0] - p[0];
            const ey = q[1] - p[1];
            const den = dx * ey - dy * ex;
            if (Math.abs(den) < 1e-12) continue;
            const t = (p[0] * ey - p[1] * ex) / den;
            const u = (p[0] * dy - p[1] * dx) / den;
            if (t > 0 && u >= 0 && u <= 1 && t > best) best = t;
          }
          radii[s] = best;
        }
        return radii;
      }

      // ---- The eight forms (unit size; the keyframe sets pixel size) ----------
      const SQUARE = toPolar(roundedPoly([[-1, -1], [1, -1], [1, 1], [-1, 1]], 0.07));

      const BLOB = (() => {
        const base = roundedPoly([[-1.08, -1.08], [1.08, -1.08], [1.08, 1.08], [-1.08, 1.08]], 0.82);
        // Gentle organic swell outward so the blobs read soft, not geometric.
        return toPolar(base).map((r, s) => {
          const th = (s / SAMPLES) * Math.PI * 2;
          return r * (1 + 0.06 * Math.cos(th - Math.PI / 2 + Math.PI) + 0.03 * Math.cos(3 * th));
        });
      })();

      const TEARDROP = (() => {
        // Round bulb outward (−y), point inward (+y): tangent lines from tip to circle.
        const c = [0, -0.38];
        const R = 0.82;
        const tip = [0, 1.3];
        const dist = tip[1] - c[1];
        const alpha = Math.acos(R / dist); // angle at circle center between tip dir and tangent point
        const base = Math.PI / 2; // direction from circle center to the tip
        const pts = arc(c[0], c[1], R, base + alpha, base + 2 * Math.PI - alpha, 96);
        pts.push(tip);
        return toPolar(roundedPoly(pts, pts.map((_, i) => (i === pts.length - 1 ? 0.12 : 0)), 12));
      })();

      const LEAF = (() => {
        // Marquise: two circle arcs meeting at points (0, ±1.35).
        const h = 1.35;
        const w = 0.55;
        const c = (h * h - w * w) / (2 * w);
        const rho = c + w;
        const a = Math.atan2(h, c);
        const right = arc(-c, 0, rho, -a, a, 72);
        const left = arc(c, 0, rho, Math.PI - a, Math.PI + a, 72);
        return toPolar(right.concat(left));
      })();

      const SEMICIRCLE = (() => {
        // Flat edge faces the center (+y), dome faces outward.
        const yFlat = 0.42;
        const pts = [[1, yFlat]].concat(arc(0, yFlat, 1, 0, -Math.PI, 96).slice(1, -1), [[-1, yFlat]]);
        const radii = pts.map((_, i) => (i === 0 || i === pts.length - 1 ? 0.12 : 0));
        return toPolar(roundedPoly(pts, radii, 10));
      })();

      const PICK = (() => {
        // Guitar pick: rounded triangle, narrow tip inward, broad shoulders outward.
        const v = [[0, 1.15], [-1.12, -0.78], [1.12, -0.78]];
        return toPolar(roundedPoly(v, [0.36, 0.5, 0.5], 28));
      })();

      const RSQUARE = toPolar(roundedPoly([[-1, -1], [1, -1], [1, 1], [-1, 1]], 0.34));

      const ARROW = (() => {
        // Dart / chevron pointing inward (+y) with a notched tail.
        const v = [[0, 1.2], [1.0, -0.78], [0, -0.22], [-1.0, -0.78]];
        return toPolar(roundedPoly(v, [0.06, 0.08, 0.05, 0.08], 10));
      })();

      // ---- Keyframes --------------------------------------------------------
      // t: phase start · shape · size (px per unit) · R: ring radius (px)
      // tilt: self rotation (deg, + = clockwise) · alt: share of the 45° rosette offset on odd shapes
      // guide: guide-circle opacity
      const KEYS = [
        { t: 0.0, shape: SQUARE, size: 76, R: 266, tilt: 0, alt: 0, guide: 0 },
        { t: 0.6, shape: BLOB, size: 98, R: 262, tilt: 12, alt: 0, guide: 0 },
        { t: 1.2, shape: TEARDROP, size: 104, R: 268, tilt: 22, alt: 0, guide: 0 },
        { t: 1.8, shape: LEAF, size: 84, R: 312, tilt: 34, alt: 0, guide: 0 },
        { t: 2.5, shape: SEMICIRCLE, size: 100, R: 262, tilt: 8, alt: 0, guide: 0 },
        { t: 3.2, shape: PICK, size: 104, R: 272, tilt: 26, alt: 0, guide: 0 },
        { t: 3.8, shape: RSQUARE, size: 92, R: 334, tilt: 40, alt: 0, guide: 0.32 },
        { t: 4.3, shape: ARROW, size: 104, R: 238, tilt: 0, alt: 0, guide: 0 },
        // Seam: identical to key 0, so frame 150 flows straight into frame 0.
        { t: 5.0, shape: SQUARE, size: 76, R: 266, tilt: 0, alt: 0, guide: 0 },
      ];

      // ---- Build the DOM ----------------------------------------------------
      const NS = "http://www.w3.org/2000/svg";
      const group = document.getElementById("shapes");
      const guide = document.getElementById("guide");
      const paths = [];
      for (let i = 0; i < COUNT; i++) {
        const p = document.createElementNS(NS, "path");
        group.appendChild(p);
        paths.push(p);
      }
      const COS = new Float64Array(SAMPLES);
      const SIN = new Float64Array(SAMPLES);
      for (let s = 0; s < SAMPLES; s++) {
        COS[s] = Math.cos((s / SAMPLES) * Math.PI * 2);
        SIN[s] = Math.sin((s / SAMPLES) * Math.PI * 2);
      }
      const lerp = (a, b, k) => a + (b - a) * k;
      const DEG = Math.PI / 180;

      // ---- Render one frame as a pure function of time ------------------------
      function render(time) {
        const t = ((time % LOOP) + LOOP) % LOOP;
        let k = 0;
        while (k < KEYS.length - 2 && t >= KEYS[k + 1].t) k++;
        const A = KEYS[k];
        const B = KEYS[k + 1];
        const e = ease((t - A.t) / (B.t - A.t));

        const size = lerp(A.size, B.size, e);
        const R = lerp(A.R, B.R, e);
        const tilt = lerp(A.tilt, B.tilt, e);
        const alt = lerp(A.alt, B.alt, e);
        const ring = (t / LOOP) * RING_TURN; // linear, no easing

        // Morphed outline in the local frame (shared by all eight shapes).
        const lx = new Float64Array(SAMPLES);
        const ly = new Float64Array(SAMPLES);
        for (let s = 0; s < SAMPLES; s++) {
          const r = lerp(A.shape[s], B.shape[s], e) * size;
          lx[s] = r * COS[s];
          ly[s] = r * SIN[s];
        }

        for (let i = 0; i < COUNT; i++) {
          // Slot angle on the ring (0 = straight up), plus the ring's rotation.
          const slot = (i * 360) / COUNT + ring;
          const sa = slot * DEG;
          const px = CX + R * Math.sin(sa);
          const py = CY - R * Math.cos(sa);
          // Rotating the local frame by the slot angle keeps +y aimed at the center
          // (facing along the ring); tilt and the rosette offset add self rotation.
          const self = (slot + tilt + (i % 2) * 45 * alt) * DEG;
          const c = Math.cos(self);
          const sn = Math.sin(self);
          let d = "";
          for (let s = 0; s < SAMPLES; s++) {
            const x = px + lx[s] * c - ly[s] * sn;
            const y = py + lx[s] * sn + ly[s] * c;
            d += (s === 0 ? "M" : "L") + x.toFixed(2) + " " + y.toFixed(2);
          }
          paths[i].setAttribute("d", d + "Z");
        }

        guide.setAttribute("r", R.toFixed(2));
        guide.setAttribute("opacity", lerp(A.guide, B.guide, e).toFixed(3));
      }

      // ---- Timeline: one linear driver, everything derived from it -----------------
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(state, { t: LOOP, duration: LOOP, ease: "none", onUpdate: () => render(state.t) }, 0);
      render(0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
